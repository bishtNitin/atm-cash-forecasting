# Configuration for ATM Cash Forecasting System

# Data Settings
data:
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  features:
    - "day_of_week"
    - "day_of_month"
    - "is_weekend"
    - "is_holiday"
    - "is_payday"
    - "lag_1"
    - "lag_7"
    - "lag_30"
    - "rolling_mean_7"
    - "rolling_mean_30"

# Model Settings
models:
  output_path: "models"
  forecast_horizon: 7  # days
  
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 7
    num_leaves: 31
    
  nbeats:
    input_chunk_length: 30
    output_chunk_length: 7
    num_stacks: 30
    num_blocks: 1
    num_layers: 4
    layer_widths: 512
    
  kats:
    prophet:
      seasonality_mode: "multiplicative"
      changepoint_prior_scale: 0.05
    theta:
      m: 12

# Backtesting Settings
backtesting:
  n_splits: 5
  test_size: 30  # days
  
# Explainability Settings
explainability:
  shap_sample_size: 100
  top_features: 10

# Dashboard Settings
dashboard:
  map_center: [20.5937, 78.9629]  # India center coordinates
  map_zoom: 5
  high_risk_threshold: 0.4  # stockout probability threshold
